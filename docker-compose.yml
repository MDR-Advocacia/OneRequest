services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onerequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_segura}
      POSTGRES_DB: ${POSTGRES_DB:-onerequest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onerequest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build: .
    command: python server.py
    ports:
      - "${APP_PORT:-5001}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-onerequest}:${POSTGRES_PASSWORD:-senha_segura}@db:5432/${POSTGRES_DB:-onerequest}
    restart: unless-stopped

  rpa:
    build:
      context: .
      dockerfile: Dockerfile.rpa
    depends_on:
      - server
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      RPA_API_URL: http://server:5000/api/rpa
      RPA_API_KEY: ${RPA_API_KEY}
      RPA_HEADLESS: "1"
      RPA_PROXY: ${RPA_PROXY:-}
      # O agendador (run_robos.py) decide a janela 7h-18h pela hora local. Sem
      # isto o container roda em UTC e os robos trabalhariam das 4h as 15h de
      # Brasilia (visto em 11/11/2026: primeira execucao marcada para 07:00 UTC).
      TZ: America/Sao_Paulo
      ONELOG_USERNAME: ${ONELOG_USERNAME:-}
      ONELOG_PASSWORD: ${ONELOG_PASSWORD:-}
      ONELOG_API_URL: ${ONELOG_API_URL:-http://api-onelog.mdradvocacia.com}
      BB_USUARIO: ${BB_USUARIO:-}
      BB_SENHA: ${BB_SENHA:-}
      LOKI_URL: ${LOKI_URL:-}
      PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-}
    restart: unless-stopped

volumes:
  pgdata:
